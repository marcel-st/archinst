# archinst defaults. Override per host in /etc/archinst/archinst.conf,
# or for all hosts in archinst.conf inside the secrets repository.
# Load order: this file -> $SECRETS_DIR/archinst.conf -> /etc/archinst/archinst.conf

# Where this repository and the private secrets repository live
ARCHINST_REPO="https://github.com/marcel-st/archinst.git"
SECRETS_REPO="https://github.com/marcel-st/secrets.git"
SECRETS_DIR="/etc/archinst/secrets"
# Client ID of the GitHub App used to log in for the secrets repo (public value,
# not a secret). Empty = git asks for username + token instead.
GITHUB_APP_CLIENT_ID="Iv23liuRhrvIBLxwrUBp"

# System
HOST_NAME="${HOST_NAME:-}"        # empty = ask (default: current hostname); env HOST_NAME wins
TIMEZONE="Europe/Amsterdam"
LOCALE="en_US.UTF-8"
KEYMAP="us"
MIRROR_COUNTRIES="NL,DE"

# Admin account used for remote management (Ansible) and AUR builds
ADMIN_USER="sysadmin"
ADMIN_GROUP="admins"
ADMIN_SSH_KEYS=()                 # extra public keys; secrets/users/*.pub are always added

BASE_PACKAGES=(
	base-devel git sudo openssh reflector iptables cronie
	neovim bash-completion man-db inetutils rsync wget lsof
	htop iftop iotop screen fastfetch
)

# Firewall (ignored when secrets/iptables/iptables.rules exists)
FIREWALL="yes"
SSH_ALLOW_V4=()                   # e.g. ("203.0.113.10" "198.51.100.0/24"); empty = anywhere
SSH_ALLOW_V6=()
OPEN_TCP_PORTS=()                 # e.g. (80 443)
OPEN_UDP_PORTS=()

# Installer (step 1, Arch ISO only)
INSTALL_DISK=""                   # empty = auto-detect / ask
ROOT_FS="xfs"                     # xfs or ext4
ROOT_PASSWORD_HASH=""             # also applied by base; empty = ask (install) / keep (base); openssl passwd -6
INSTALL_MODULES=()                # modules to apply after base, e.g. (docker sshguard)
ASSUME_YES="no"                   # "yes" skips the disk wipe confirmation

# Modules
DOCKER_PACKAGES=(docker docker-compose docker-buildx ducker)
BACKUP_PATHS=(/etc /opt /root)
BACKUP_SCHEDULE="daily"
SSHGUARD_WHITELIST=()
